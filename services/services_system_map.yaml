        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 在取得 DB connection 前嚴格驗證 case_no、event_key、actor 必須是 trim 後非空字串且不得自動改寫原值；plan_id
      必須為非 bool 正整數。拒絕未知 kwargs，不由 orders.staff_id、姓名、matching_records 或候選快取推測方案與月嫂。
    - 取得單一 connection／DictCursor 後，先以參數化只讀查詢載入 plan header 與全部 segments，僅為取得明確 staff_ids；要求一至四段、segment_order
      連續、staff 唯一、日期合法且 segments 完整覆蓋 plan 所屬案件預計服務含端點區間。此階段不得寫入或相信為最終驗證。
    - 以預讀 segments 的 staff_ids 呼叫 StaffOccupancyMutexService 恰好一次；取得 staff rows 的共同
      mutex 後，才依固定順序以回傳實體列的 `SELECT ... FOR UPDATE` 鎖定 orders.case_no、plan header、plan
      segments、該 staff 的未取消 case_staff_assignments、assignment-owned／legacy staff_schedule、active
      availability lock headers、active lock days及相同 event_key event。不得用 COUNT／SUM／MAX／EXISTS
      鎖定、不得在 mutex 前鎖定任何 occupancy-owner row。
    - 在 mutex 仍持有時重新建立 plan 與 segment canonical snapshot，要求 order 仍為洽談中、plan 屬於 case_no、status=proposed、is_active=1，且重讀
      segments 與預讀 snapshot 精確相等；任何 stale、missing、extra、duplicate、accepted/rejected/superseded/cancelled
      狀態均 fail-closed，唯有下述相同 event_key 的精確冪等重試例外。
    - 將每段起訖含端點展開成逐日鎖定集合；在同一 mutex 下重查每個 staff/date 是否落入其他未取消正式 assignment、任何 assignment-owned
      排班、assignment_id=NULL legacy 排班或 active availability lock day。任何衝突零寫入，回報精確 staff_id、lock_date、source_type
      與 source_id；不得因同 case_no、同 plan、日期邊界或 legacy ownership 不明而忽略。
    - 若 event_key 已存在，只有 event_type=lock_acquired、actor、reason=null、payload、lock header、全部
      lock days、plan_id、case_no 與本次 canonical request 精確一致，且 lock 仍為 active、plan 仍為
      accepted 時回傳 existing；任何 event_key 重用、部分資料、已解除／轉換／取消或內容差異均 fail-closed，禁止修補或新增第二事件。
    - 無既有事件時，依序 INSERT 一筆 active lock header、所有逐日 active lock rows；將同一 plan header
      從 proposed 更新為 accepted 且保持 is_active=1；最後 INSERT 一筆 reason=null 的 lock_acquired
      event，payload 必須是以穩定 key／陣列順序序列化的 JSON object，精確保存 case_no、plan_id、lock_id、actor
      與全部 segment/date snapshot。
    - header、所有 days、plan lifecycle update 與 acquired event 必須使用同一 connection／cursor並只
      commit 一次；任何 validation、DB unique/FK、execute/fetch 或序列化錯誤都 rollback，禁止留下部分鎖定或
      accepted-without-lock 狀態。cursor/connection 在成功、失敗及 cursor 建立失敗路徑都安全且各自最多關閉一次，close
      錯誤不得遮蔽主要例外或阻止 connection.close。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
