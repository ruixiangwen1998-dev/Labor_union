    description: 附加人工 workflow 或既有正式交易的不可變警示事件；只驗證來源引用與事件去重，不建立或修改正式交易。
    source: services/finance_alert_events.py::append_finance_alert_event
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - FinanceAlertSchema
    - PaymentSchema
    - StaffActualTransferSchema
    - GovernmentSubsidyTransactionSchema
    input:
      event: alert_id、唯一 event_key、事件類型、occurred_at、actor／reason、event snapshot、source_type／source_id；retransferred
        另含 original_source_id
    output:
      event: 新建或既有 append-only event
      result: created 或 existing
    exceptions: []
    invariants:
    - event_key 必須唯一；完全相同內容重跑回 existing，任何 immutable 欄位衝突必須 fail-fast。
    - claimed／resolved 只能引用既有 finance_alert，並保存明確 actor；resolved 必須保存非空 reason。
    - 正式來源只允許 client_payment_transaction、staff_payment_transaction、staff_actual_transfer、government_subsidy_transaction；必須依
      source_type 讀取對應正式表，不得只相信呼叫端傳入的 source_id。
    - failed 必須引用 transaction_status=failed；returned 必須引用 transaction_type=return
      或 refund 且 status=succeeded；reversed 必須引用 transaction_type=reversal 或 status=reversed
      的正式列。
    - retransferred 必須同時引用 original_source_id 與新的 source_id；兩者必須屬於相同 source_type，新列為成功
      transfer／receipt 且 external_reference 非空並與原列不同。本服務不得產生 external_reference、交易、allocation
      或正式淨額。
    - 所有事件只可 INSERT finance_alert_events；不得 UPDATE 或 DELETE 既有事件。
    preferred_pattern: none
    verification:
    - must_have_assertions
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_finance_alert_events.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-b6-finance-alert-events
        cwd: project
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 驗證 alert、事件類型、時間與必要 actor／reason，依 event_type 解析允許的正式 source_type。
    - 對正式來源以固定 source_type→table mapping 和參數化主鍵鎖定讀取，比對 transaction type/status/external_reference；不得接受任意
      table 名稱。對 workflow 來源鎖定 finance_alert。
    - retransferred 額外鎖定同表原交易，驗證新舊 ID 與 external_reference 不同，且新列是成功 transfer／receipt。
    - 以 event_key 鎖定查詢；不存在時新增，存在時逐欄比對 immutable event snapshot。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals: []
    sub_map: services_layer
    state: planned
    fan_in_snapshot: 3
