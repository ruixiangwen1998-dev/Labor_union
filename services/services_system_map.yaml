    - 訂金首次全額核銷時，僅將目前為洽談中的同一 case_no 案件自動更新為訂單成立；歷史資料仍可在單筆訂單頁以受稽核的人工流程建立。
    - 觸發點 1（完工後收清）：在成功寫入 succeeded 收款交易且更新後 amount_received 等於 amount_receivable 時，透過
