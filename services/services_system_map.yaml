    exceptions: []
    invariants:
    - assignment 查詢必須嚴格綁定 WHERE case_staff_assignments.id = assignment_id；找不到時回傳 not_found。
    - 嚴禁將 assignment_id 當作 staff_id 使用，嚴禁依據 case_no、姓名、日期或最近一筆指派推測 assignment。
    - rest_dates 必須嚴格驗證 YYYY-MM-DD 格式、去重並穩定排序；任一非法日期必須整筆失敗，不得靜默忽略。
    - 已取消之 assignment 不得進行任何排修或排班修改。
    - 若已存在付款鎖、月結鎖、人工 actual_hours 覆寫鎖或其他正式鎖定，必須回傳 conflict/requires_review。
    - 不得使用整張訂單 service_days 為單一 assignment 產生完整排班，必須以 assignment 自身的開工日、完工日、allocated/planned
      hours 或正式 ownership 計算；若現有 schema 無法唯一決定服務天數，必須回傳 requires_allocation/requires_review，不得任意猜測。
    - 所有 staff_schedule 異動必須嚴格限定 WHERE assignment_id = %s；嚴禁執行 DELETE FROM staff_schedule
      WHERE case_no = %s。
    - 嚴禁修改其他 assignment 的排班；不得自動延伸或移動下一位月嫂的 assignment；若順延後與下一指派重疊，必須回傳 409 conflict/requires_review。
    - 所有讀鎖、刪除、插入、assignment 更新及 audit 寫入必須在同一資料庫 Transaction 內執行，任一步驟失敗全部 rollback。
    - 單一 assignment 不得直接覆寫 orders.custom_rest_dates 或 orders.actual_end_date。
    - 本Service不得拋FastAPI HTTPException；blocked／requires_review／stale confirmation等business
      conflicts必須回傳正常領域結果。只有application／data_integrity／infrastructure typed exception可拋出並由集中API
      handler映射。
    - details 僅允許字串鍵 mapping、list／tuple 與 null、boolean、string、有限數值等 JSON scalar；set、非字串鍵、非有限數值、date／datetime
      或自訂物件必須在建構時拒絕。
    - details 內部必須遞迴不可變且與輸入隔離；as_dict() 必須回傳普通、copy-safe、可由 json.dumps 直接序列化的資料。
    - DB driver或其他infrastructure failure只可包裝為保留cause的typed infrastructure exception；不得包成validation、business
      conflict或暴露driver message。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests/test_assignment_rest_date_service.py
        - -q
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: low
    algorithm:
    - '1. validate: 驗證輸入參數與 rest_dates 之 YYYY-MM-DD 格式。'
    - '2. canonicalize: 對 rest_dates 進行去重與排序取得 canonical_rest_dates。'
    - '3. lock/read assignment: 在 Transaction 內依 assignment_id 讀取並鎖定目標指派。'
    - '4. check cancellation/payment/settlement/hour locks: 檢查指派是否取消或存在付款/月結/人工時數鎖。'
    - '5. determine assignment-owned target: 依指派自身額度與 ownership 計算目標天數與完工日。'
    - '6. check overlap: 檢查順延完工日是否與同案件其他指派重疊。'
    - '7. calculate: 重新計算單日排班與休假。'
    - '8. transactional replace: 在同一 Transaction 內更新 staff_schedule。'
    - '9. update assignment-owned summary: 更新指派專屬完工日與狀態。'
    - '10. audit: 寫入異動稽核日誌。'
    - '11. return result: 回傳處理結果結構。'
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
    - 不由單一 assignment 節點計算或寫入訂單整體完工日與全局 custom_rest_dates (改由獨立跨指派協調節點處理)。
