    - Excel 一基底第 12 欄位於「交易參考編號」與「更正註記」之間，雖然表頭為空白，仍是正式帳號比對欄位；不得視為無效空欄或只留在 raw_payload。
    - 第 12 欄原值必須保存至 bank_references.comparison_field，並映射為 canonical memo 供下游優先精確比對完整帳號；只有第
