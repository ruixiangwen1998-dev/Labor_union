      的正式補助退還義務；依 COALESCE(od.govt_claim_date, cp.subsidy_return_due_date) 的年份月份是否等於
      target_month 納入，優先使用 v_order_details 的推算市府請款／退款日 govt_claim_date，當其為空時才以 cp.subsidy_return_due_date
      補齊。金額只可使用原始 cp.subsidy_return_receivable，不得使用 od.subsidy_salary 或其他推算金額；不得以
      subsidy_return_refunded、目前未退餘額或 subsidy_return_review_status 過濾。
