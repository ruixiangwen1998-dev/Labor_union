  StaffOccupancyMutexService:
    type: service
    description: 為等待訂金日期鎖、正式 assignment、排班建立與調整交易提供共用的月嫂占用互斥協議；在呼叫端既有 transaction
      內依 staff_id 固定順序鎖定 staff 實體列，使所有 writer 能在同一 mutex 下重查 assignment、schedule 與
      active lock 衝突，避免跨表競態。
    source: services/staff_occupancy_mutex_service.py::lock_staff_occupancy_mutex
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - DbService
    - MultiCaregiverScheduleSchema
    - CaregiverAvailabilityLockSchema
    input:
      cursor: 呼叫端單一 transaction 所擁有的 PyMySQL DictCursor；本服務不得自行建立 connection 或 cursor。
      staff_ids: 本次即將建立或調整占用的一至四個明確月嫂正整數 id。
    output:
      locked_staff_ids: 依 staff_id 升冪穩定回傳、已由同一 cursor 取得 FOR UPDATE row lock 的月嫂 id。
    exceptions: []
    invariants:
    - 本節點是 transaction primitive，只能使用呼叫端傳入的 cursor；不得 import／呼叫 get_connection，不得建立第二
      cursor，不得 commit、rollback、close 或使用 server clock。
    - 所有等待訂金 lock acquisition／release／conversion、正式 assignment 建立／切段及 staff_schedule
      建立／調整 writer，後續架構節點都必須先呼叫本節點鎖定受影響 staff，再於同一 connection／cursor、鎖仍持有時重查 active
      assignments、assignment-owned／legacy schedules 與 active availability lock days；只讀候選查詢不取代此協議。
    - 鎖定 SQL 必須只讀 staff.id，使用 staff_id 升冪固定順序與 `FOR UPDATE`；不得用 COUNT／MAX／EXISTS 等
      aggregate、不得分批依呼叫端順序鎖定、不得動態拼接 id 值或允許空 IN。
    - 回傳結果必須與 requested canonical ids 完全相等；缺少任何 staff、DB duplicate、非整數或額外 id 都必須拋出
      validation error，不得回部分成功。
    - 本節點不得 SELECT assignment、schedule 或 lock conflicts；各 writer 在取得共同 mutex 後依自身交易語意重查。不得
      INSERT／UPDATE／DELETE／REPLACE 任一資料表。
    - 驗收測試必須直接覆蓋一至四個 staff、亂序輸入仍升冪鎖定、bool／零／負數／非整數／重複／空值／超過四筆、missing／extra／duplicate
      DB rows，以及 cursor.execute／fetchall 例外；tuple／list／scalar row、缺少或額外 mapping key
      均須 fail-closed，並明確證明 `(1, "unexpected-extra-column")` 不得被接受。
    - 驗收測試必須斷言 cursor 恰為呼叫端物件、execute 恰好一次、SQL 參數化 placeholder 數量等於 staff 數、參數升冪、精確
      `ORDER BY id FOR UPDATE`，且以 AST／source guard 禁止建立 cursor、transaction lifecycle、server
      clock、寫入 SQL，以及查詢 assignment／schedule／availability-lock 表。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_staff_occupancy_mutex_service.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-staff-occupancy-mutex-service
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 嚴格驗證 staff_ids 為一至四筆 list；拒絕 bool、零、負數、非整數、重複值與未知包裝結構，不從姓名、orders.staff_id、方案或排班推測
      staff。
    - 在不改寫呼叫端輸入的前提下建立 staff_id 升冪 canonical list；使用單一參數化 `SELECT id FROM staff WHERE
      id IN (...) ORDER BY id FOR UPDATE` 一次鎖定全部實體 staff rows。
    - 查詢結果的每一 row 必須是 DictCursor 回傳的 mapping，且 key 集合精確為 `{"id"}`；拒絕 tuple、list、scalar、缺少／額外
      key、bool／非正整數 id、duplicate／額外 row。不得只取位置 0 或忽略額外欄位；若任何 requested staff 不存在或結果不精確相等，立即
      fail-closed，由呼叫端 rollback。
    - 成功只回傳 locked_staff_ids；row locks 由呼叫端 transaction 持有至 commit／rollback，本服務不釋放、不另開
      transaction。
    idempotency:
      level: unknown
