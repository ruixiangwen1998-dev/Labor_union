    type: import_pipeline
    description: 由人工 CLI 對任意檔名的歷史、台新或永豐 Excel 執行正式匯入或完整 dry run；兩種模式共用 normalization、append-only
      staging、分類與正式核銷判斷，dry run 最後強制 rollback 並輸出可重現 manifest。
