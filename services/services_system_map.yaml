  CaregiverSegmentAvailabilityService:
    type: service
    description: 依案件預計服務期間、正式 assignment／排班及等待訂金 active locks 搜尋可形成一至四個連續服務區段的月嫂候選；segment_count=1
      只由專用 API gate 內部呼叫，多段供 2／3／4 段產品 fallback，無完整組合時仍回傳逐段部分可行結果與明確衝突。
    source: services/caregiver_segment_availability_query_service.py::search_segmented_caregiver_availability
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - DbService
    - CaregiverMatchingPlanSchema
    - CaregiverAvailabilityLockSchema
    - MultiCaregiverScheduleSchema
    - CaregiverSegmentAvailabilityInternalHelpers
    input:
      case_no: 唯一案件編號。
      segment_count: 搜尋區段數，嚴格允許 1、2、3 或 4；1 只作單月嫂完整期間 gate。
      segment_drafts: 依 UI 順序提供的可編輯區段草稿；每段可含指定 staff_id、start_date、end_date，未指定欄位由搜尋器求解。
      as_of: 本次唯讀一致性查詢時間；由呼叫端提供且不得在迴圈內改用現在時間。
    output:
      case_no: 原案件編號。
      planned_start_date: 案件預計服務起日。
      planned_end_date: 案件預計服務迄日。
      feasibility: complete 或 partial。
      complete_combinations: 依穩定排序回傳可完整覆蓋服務期間的一至四段候選組合。
      segment_candidates: 各區段可用月嫂、最早／最晚可服務日及可選連續日期範圍；即使 feasibility=partial 也必須保留。
      conflicts: 逐區段、逐 staff_id、逐日期的 assignment、schedule、active_lock、draft_overlap
        或 coverage_gap 原因。
    exceptions: []
    invariants:
    - 本節點為唯讀服務，不得 INSERT、UPDATE、DELETE、REPLACE、commit、rollback 或取得 FOR UPDATE lock。
    - 主服務實作必須與純 helper 分檔；不得在 services/caregiver_segment_availability_service.py 新增
      DbService、connection、SQL、環境或時鐘 import／呼叫。
    - 每次 public service 呼叫只能取得一個 DB connection，所有案件、active staff、assignment、schedule
      與 active lock SELECT 必須重用該 connection／cursor；cursor 與 connection 都必須在成功及任一例外路徑的
      finally 關閉。測試必須斷言 get_connection 恰好一次，並分別斷言成功與 helper／SQL 例外時 cursor.close、connection.close
      都恰好一次。
    - 僅搜尋一至四段候選；segment_count=1 只供單月嫂完整期間可行性判斷，segment_count=2／3／4 供多人 fallback。不得建立或修改
      caregiver_matching_plans、segments、availability locks、matching_records、case_staff_assignments、staff_schedule、payment
      或 settlement。
    - 案件預計服務日期是唯一 coverage 邊界；不得以今日日期截斷、改寫或忽略歷史日期。
    - 正式占用必須以 assignment_id 與 assignment-owned schedule 判斷；不得使用 orders.staff_id 作為正式月嫂或占用來源。
    - 不得呼叫 get_recommended_staff_for_order 或任何 legacy recommendation call chain；所有
      SQL 與被呼叫函式的 source review 都不得讀取 orders.staff_id。
    - 正式 case_staff_assignments 日期區間即使尚無 staff_schedule 也必須以 assignment reason 阻擋逐日候選；既有
      assignment-owned staff_schedule 另以 schedule reason 阻擋。
    - MySQL driver 回傳的 date／datetime 型別不得直接傳入只接受字串的 helper；order、assignment、schedule
      work_date 與 active lock lock_date 都必須正規化為精確 YYYY-MM-DD。驗收測試必須以真實 date 物件覆蓋 schedule
      與 lock 投影。
    - active 等待訂金鎖必須參與衝突判斷；released、converted、cancelled 或 active_marker IS NULL 的舊鎖不得繼續占用檔期。
    - 每段必須是單一月嫂的連續日期區間；完整組合必須依序銜接並恰好覆蓋整個案件期間，不得重疊或留白。
    - segment_count、日期格式、日期範圍或草稿順序非法時必須整筆 validation_error，不得靜默調整使用者輸入。
    - 部分可行結果是正式輸出契約；不得因任一區段無解就回傳空清單或隱藏案件。
    - conflicts 必須包含穩定 reason code、staff_id 與 work_date；不得只回傳人類文字或洩漏其他案件的客戶姓名、備註與敏感資料。
    - 不處理履歷／info 發送、意願更新、方案保存、客戶確認鎖定、回復未綁定、取消釋放或訂金轉正式 assignment；這些由後續獨立 transaction
      service 節點承接。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_caregiver_segment_availability_service.py
        - tests\test_caregiver_segment_availability_internal_helpers.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-caregiver-segment-availability-service
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 以 case_no 載入案件並驗證狀態仍為洽談中、planned_start_date／planned_end_date 完整且起日不晚於迄日；找不到或資料不足時回傳穩定領域錯誤，不得猜測日期。
    - 全程只呼叫一次 get_connection 並重用同一 connection／cursor，依序取得案件、active staff 候選、正式 case_staff_assignments、assignment-owned
      staff_schedule 與 active caregiver_availability_lock_days；不得讓各資料集來自不同 connection
      或不同 snapshot。所有 DB DATE／DATETIME 值必須在交給純 helper 前正規化為精確 YYYY-MM-DD 字串。
    - 候選來源只允許 staff 主檔中 status=active 的明確 staff.id；不得呼叫或間接呼叫會查詢 orders.staff_id 的
      legacy RecommendService。區域、胎數等非檔期排序不屬本節點。
    - 將與案件期間重疊的正式 assignment 起訖區間展開為 reason_code=assignment 的逐日 facts；將 assignment-owned
      staff_schedule 投影為 reason_code=schedule。即使正式 assignment 尚未產生日排班，也必須阻擋其 staff/date。
    - 將案件日期、segment_count、segment_drafts、候選月嫂與占用 facts 傳給 CaregiverSegmentAvailabilityInternalHelpers；主服務不得另寫第二套日期驗證、區間列舉或組合演算法。
    - 將 helper 的完整組合、逐段候選與 conflicts 組裝為正式輸出；完整組合存在時 feasibility=complete，否則為 partial
      且不得丟棄部分結果。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
    - 不寫入配對方案、日期鎖、正式 assignment、排班、薪資或稽核事件。
    - 不處理正式案件服務中的跨 assignment 順延、單日休假或代班。
    - 不以候選搜尋結果取代鎖定當下重新查詢檔期的交易內驗證。
    sub_map: services_layer
    state: dirty
    fan_in_snapshot: 3
  CaregiverSegmentAvailabilityInternalHelpers:
    type: service
    description: '[目前代碼規格：內部 1–4 段] 以純函式嚴格驗證一至四段草稿，將 assignment-owned schedule 與 active
      lock day facts 轉為逐日占用，列舉連續可用區間、完整覆蓋組合及部分可行衝突；不存取資料庫。1 段只供專用單月嫂 eligibility gate
      內部委派，公開多人搜尋與產品 fallback 只接受 2／3／4 段。'
    source: services/caregiver_segment_availability_service.py::validate_segment_search_input,derive_segment_availability
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies: []
    input:
      planned_start_date: 案件預計服務起日。
      planned_end_date: 案件預計服務迄日。
      segment_count: 僅允許嚴格整數 1、2、3 或 4。
      segment_drafts: 可含指定 staff_id、start_date、end_date 的有序草稿。
      candidate_staff_ids: 可參與本次搜尋的明確 staff_id 集合。
      assignment_schedule_days: assignment-owned 正式占用 facts；每筆可用 reason_code=assignment
        或 schedule 區分正式區間與日排班。
      active_lock_days: active_marker=1 的等待訂金占用 facts。
    output:
      validated_input: 不修改原輸入的 canonical 日期、區段數與草稿。
      complete_combinations: 恰有 segment_count 段並完整覆蓋案件期間的穩定排序組合。
      segment_candidates: 每段可用月嫂及連續日期範圍。
      conflicts: reason_code、segment_index、staff_id、work_date 組成的穩定排序衝突。
    exceptions: []
    invariants:
    - 所有函式必須為 deterministic pure functions；不得 import DbService、建立 connection、執行 SQL、讀取時鐘、環境變數或
      filesystem。
    - 不得修改傳入的 dict、list、set 或日期集合；重複呼叫相同輸入必須得到相等且順序一致的輸出。
    - segment_count 只允許嚴格整數 1、2、3、4；bool 不得視為整數。
    - 日期只接受精確 YYYY-MM-DD 字串；不得接受 datetime、date、空白包覆、非零填充或案件期間外日期。
    - candidate_staff_ids 必須為 list；不得接受 set 或其他 unordered iterable，canonical 去重結果必須穩定。
    - 草稿只指定 start_date 或只指定 end_date 時仍必須參與跨草稿順序驗證；任何逆序都必須整筆拒絕。
    - assignment_schedule_days 必須具有明確 assignment_id、staff_id、work_date；不得接受 lock_date
      作為 work_date 的別名。reason_code 只允許 assignment 或 schedule，省略預設為 schedule。合法 staff/date
      但缺 assignment_id 的 legacy 排班不得推測權屬，必須形成 requires_review 衝突且 fail-closed 阻擋該
      staff/date 候選。
    - active_lock_days 只有型別精確為 int 的 active_marker=1 才能占用；0／null inactive 歷史列不得阻擋候選。必須先以
      type(active_marker) is int 或等價嚴格型別檢查排除 bool，再判斷 0／1；不得因 False == 0 或 True ==
      1 而接受任何 bool。
    - assignment_schedule_days／active_lock_days 的非 list、非 dict row、未知欄位或非法欄位值必須明確
      validation_error，不得靜默忽略。
    - 草稿指定的 start_date 與 end_date 都是精確邊界；完整組合與 segment candidate 不得擅自縮短、延長或移動任一已指定邊界。
    - 完整組合必須恰有 segment_count 段、逐日完整覆蓋、無重疊、無缺口，且每位月嫂最多一段。
    - 部分可行結果與 conflicts 不得因找不到完整組合而被清空。
    - 驗收測試必須直接且逐案覆蓋：start-only／end-only 逆序；fixed end 不可縮短；assignment 與 schedule reason
      各自保留，且各自直接斷言對應 staff/date 不得出現在任何 segment_candidates 或 complete_combinations；assignment
      fact 只給 lock_date 而無 work_date 必須拒絕；未知 reason_code 拒絕；legacy requires_review
      日不可出現在任何 segment_candidates 或 complete_combinations；active_marker=True 與 active_marker=False
      各自拒絕；active_marker=0 與 null 各自不阻擋候選／完整組合；set 與 tuple candidate_staff_ids 各自拒絕；assignment／lock
      facts 的非 dict row、unknown fields、非法值各自拒絕；相同輸入重複呼叫結果完全相等；並以 source AST 或 monkeypatch
      證明 helper 檔案不 import DbService、不讀 DB、SQL、時鐘、環境變數或 filesystem。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_caregiver_segment_availability_internal_helpers.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-caregiver-segment-availability-helpers
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 嚴格拒絕 bool／非整數 segment_count、非 1 至 4、草稿過多、未知欄位、非正整數 staff_id、非 YYYY-MM-DD 字串、越界日期、起日晚於迄日及已指定草稿互相逆序；只要草稿具有
      start_date 或 end_date 就必須參與跨草稿順序檢查，不得 strip、截斷或自動交換日期。
    - candidate_staff_ids 只接受 list，依首次出現順序去重；不得接受 set、tuple、generator 或依 unordered
      iteration 產生 canonical output。
    - assignment_schedule_days 與 active_lock_days 只接受 list of dict 且拒絕未知欄位、非法 staff_id／work_date／assignment_id／reason_code／active_marker；不得
      silently continue malformed facts。assignment facts 必須明確使用 work_date，禁止以 active-lock
      專用的 lock_date 代替；active lock facts 才可使用 lock_date。assignment facts 的 reason_code
      只允許 assignment 或 schedule，省略時相容為 schedule；展開案件含端點逐日集合並依 reason_code 建立占用索引，重複
      facts 去重但不得改變衝突語意。
    - assignment schedule 有合法 staff_id／work_date 但 assignment_id 缺失時，必須同時產生 requires_review
      conflict 並將該 staff/date fail-closed 視為占用；不得讓 legacy ownership 未確認日進入 segment_candidates
      或 complete_combinations。
    - active_marker 只有型別精確為 int 且值為 1 才占用；0 或 null 為歷史 inactive 而不阻擋，bool 與其他值必須 validation_error。
    - 保留草稿已指定的 staff_id 與日期邊界，列舉每位候選月嫂在各段可用的最大連續日期範圍；assignment、schedule 或 active
      lock 占用日不得進入候選。
    - 以最多四段的有界回溯列舉日期依序相接、無重疊、無缺口且完整覆蓋案件期間的組合；同一組合內同一 staff_id 最多一段。草稿指定 start_date
      或 end_date 時必須逐字保留為該段實際邊界，不得只當搜尋上限或擅自縮短／延長。
    - 無完整組合時仍保留各段候選，並對不可用日期產生 assignment、schedule、active_lock、draft_overlap 或 coverage_gap
      衝突。
    - complete_combinations 依區段起日、staff_id、區段迄日排序；segment_candidates 與 conflicts 依
      segment_index、staff_id、work_date、reason_code 排序。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
