      - 政府補助、客戶退補助及服務人員轉帳只在候選唯一、金額完整相符且下游 service 回 reconciled 時建立正式交易；其他情況保留 pending/non_business_review。
      - 銀行流水只能登記實際金額與日期，不得反推或覆寫應收、應付、申請核准額或月結月份。
      - 系統不執行銀行轉帳；本入口只匯入銀行已發生的交易並核銷既有義務。
      - 任一資料庫錯誤必須 rollback 整批；不得留下部分成功 batch。
      - 同一檔案混合 skipped_existing 與 inserted rows 時，既有列只新增 occurrence，新列仍須正常分類與 dispatch；不得因局部重複跳過整批。
      - 跨檔名、工作表或列號重匯相同 fingerprint 時，不得覆蓋 canonical row、人工調整或正式帳務；只允許新增 occurrence。
      - 同秒同備註但 fingerprint 不同的兩筆交易都必須保存；若兩筆命中同一已完成或已被前筆占用的客戶應收義務，後筆必須保持 pending、不得超收，並保留
        suspected_duplicate_business_match 警示。
      - 客戶入款的虛擬帳號錯誤、案件不存在／不唯一、超收或殘缺重試皆須保留 canonical staging 與 occurrence，且不得建立或修改正式客戶交易、三期實收摘要及案件狀態。
      - 建立客戶帳務快照時，訂單資格只能 join clients.identity_status；不得選取、傳遞或寫入 clients.identity_status。
      - dry_run=true 必須執行與正式匯入相同的 normalization、identity map、staging、classification、dispatch
        與 batch completion 路徑，成功或失敗皆不得 commit；成功完成後必須明確 rollback。
      - dry run manifest 必須包含來源絕對路徑、格式、工作表、表頭列、normalized row 數、每列 fingerprint／分類／dispatch
        result 與 reason、彙總計數及 transaction_outcome=rolled_back；不得把暫存 row id 或 batch
        id 宣稱為可持久查詢識別。
      - '`document/資料庫、資料處理/歷史對帳單.xlsx` 是固定驗收檔；目前唯一流水必須判定為 non_business_review、reason=sinopac_staff_account_no_match，不得以姓名「張淑婷」猜測月嫂身分或建立正式帳務交易。'
      type: import_pipeline
      domain: Services
