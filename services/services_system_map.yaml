    - 已建立 cp.subsidy_return_receivable 大於 0 正式義務的客戶列，即使 subsidy_return_review_status=review_required
      仍須保留於其預定退款月份，payable_rows 顯示待人工覆核；不得以該狀態過濾歷史資料。尚未建立正額正式義務的零額覆核候選不得進入待匯或預覽清單；固定九欄銀行
      XLSX 亦不得新增或刪除欄位。
    - 日期尚未到不構成排除條件；選取未來月份時必須能預先產生該月份應出帳明細，且不得使用實際銀行出帳日期作為查詢依據。
    - 月嫂款使用出款銀行代碼 31（永豐銀行）；客戶退還補助款使用 633（台新銀行）。解約退款不得納入。
