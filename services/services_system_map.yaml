  CaregiverAvailabilityLockAcquisitionService:
    type: service
    description: 客戶確認目前配對方案後，在單一交易與共用 staff mutex 下重查訂單、方案、正式 assignment／排班及等待訂金鎖衝突，原子建立完整
      active 鎖定批次、逐日占用與 lock_acquired 稽核事件，並將方案推進 accepted；不解除、取消或轉成正式 assignment。
    source: services/caregiver_availability_lock_service.py::acquire_caregiver_availability_lock
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - DbService
    - CaregiverMatchingPlanSchema
    - CaregiverAvailabilityLockSchema
    - CaregiverAvailabilityLockEventSchema
    - MultiCaregiverScheduleSchema
    - StaffOccupancyMutexService
    - CaregiverAvailabilityLockAcquisitionInternalHelpers
    input:
      case_no: trim 後非空的訂單唯一案件編號。
      plan_id: 客戶明確確認的目前配對方案正整數 id。
      event_key: 呼叫端提供、trim 後非空且全域唯一的 acquired 事件冪等鍵。
      actor: trim 後非空的管理員識別。
    output:
      availability_lock_result: '`created` 或 `existing`、lock_id、plan_id、case_no，以及依
        segment_order／lock_date 穩定排序的 segment_id、staff_id、lock_date 明細。'
      conflicts: 僅驗證失敗 payload 使用，依 staff_id、lock_date、source_type、source_id 穩定排序，精確指出
        assignment、schedule 或 active_lock 衝突。
    exceptions: []
    invariants:
    - 本節點是 customer-confirmation acquisition 的唯一 transaction owner；不得呼叫只讀候選結果取代 mutex
      後重查，不得建立第二 connection/cursor、巢狀 transaction 或使用 server clock。
    - StaffOccupancyMutexService 每個 public call 必須恰好一次且發生在任何 `FOR UPDATE` occupancy-owner
      查詢與第一個寫入之前；其回傳 ids 必須與 canonical segment staff_ids 精確相等。
    - 鎖定順序固定且所有 SQL 參數化；assignment、schedule、lock header/day 查詢必須回傳可鎖定的實體 id 與衝突欄位，不得以
      aggregate 或未加 `FOR UPDATE` 的結果宣稱完成交易重查。
    - 同一方案最多四段且每位月嫂一段；逐日 lock 必須精確等於所有 segment 含端點日期聯集。不得接受部分日列、額外日列、重疊、空缺、越界、順序錯誤或
      plan/case ownership 不一致。
    - 正式 assignment 與 staff_schedule 都是衝突來源；assignment_id=NULL 的 legacy schedule 必須
      fail-closed 視為占用，不得以 plan.case_no 相同、orders.staff_id、姓名或唯一候選推測可忽略。
    - acquisition 不改變 orders.status，訂單必須維持洽談中等待訂金；只允許 caregiver_matching_plans proposed→accepted、建立
      caregiver_availability_locks／days 與 append-only acquired event。
    - 不得 INSERT／UPDATE／DELETE matching_records、orders、case_staff_assignments、staff_schedule、payments、actual_hours、settlements；不得建立正式
      assignment 或正式日排班。
    - 冪等只接受相同 event_key 與全量 canonical snapshot 精確一致的 active 結果；不得以 plan_id、case_no、actor
      或現有 active header 單獨視為相同請求。
    - actor、case_no、event_key 不得 strip 後保存另一值；空白拒絕。所有 DB row 只接受 DictCursor mapping
      與查詢宣告的精確 key 集合，tuple/list/scalar、缺少／額外 key、bool id 及非法日期一律 fail-closed。
    - 驗收測試必須覆蓋單段及二／三／四段 created、精確重試 existing、event_key 內容重用、非 proposed／非 active／跨
      case plan、非洽談中、stale segment snapshot、missing／extra／duplicate/malformed DB rows與
      mutex 回傳不一致。
    - 驗收測試必須逐一覆蓋 assignment date-range、assignment-owned schedule、legacy schedule、其他
      active lock 的衝突，並斷言每種情境零 INSERT／UPDATE／commit、conflicts 含精確 staff/date/source；released／converted／cancelled
      lock 不得繼續占用。
    - 驗收測試必須斷言 mutex 恰好一次且先於所有 occupancy `FOR UPDATE`／write、單一 connection/cursor、固定鎖順序、無
      aggregate lock query、逐日 insert 完整排序、plan 只做 proposed→accepted、event payload
      穩定、commit 恰一次。
    - 驗收測試必須覆蓋 get_connection、cursor 建立、mutex、各 execute/fetch、每筆 day insert、plan update、event
      insert、commit、rollback、cursor.close、connection.close 例外；失敗不得回 created/existing，且
      source 無第二 connection/cursor、server clock、orders／assignment／schedule 寫入或 DELETE。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_caregiver_availability_lock_acquisition_service.py
