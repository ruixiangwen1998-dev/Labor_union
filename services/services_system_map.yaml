    - 完全相同 detection、claim 與 resolve 重跑只回 existing，不新增 alert 或 workflow event，不覆寫人工結果，也不重開
      resolved。
    - 同一 operator claim 重試必須 idempotent；另一 operator 搶占已認領警示必須 conflict 且不改變 claimant。
    - resolve 必須保存 actor、reason、time 與事件；解除警示不得被視為 transaction、allocation 或 reconciliation
