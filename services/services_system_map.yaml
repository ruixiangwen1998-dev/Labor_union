version: 36.0
scope: services_layer
modules:
  DbService:
    type: service
    description: 主資料庫與 CRUD 操作服務；訂單公開識別一律使用唯一 case_no，並以同一案件編號載入 BeClass 服務細項；通用資料表瀏覽與更新不得再暴露
      legacy payments。
    source: services/db_service.py::safe_float,safe_int,safe_date,generate_virtual_account,get_connection,_resolve_case_no,get_order_by_case_no,get_table_data,get_table_columns,update_table_row,parse_beclass_survey_details,get_order_details,get_case_order_details,create_order,assign_staff_to_order,update_order_status,update_order_full_details,add_or_update_holiday,delete_holiday,get_staff_monthly_schedule,save_order_rest_dates,generate_default_schedule,update_schedule_day,get_order_matches,create_or_get_match_record,update_matching_info_sent,reply_matching_inquiry,parse_client_district,backfill_client_payment_due_dates,sync_client_payment_due_dates_for_case_no,_sync_client_payment_due_dates_with_cursor,_count_missing_client_payment_due_dates
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - InitDB
    input:
      case_no: 訂單唯一公開識別鍵。
      create_order_fields: service_days、service_hours_per_day、floor_fee、日期與 status；身分資格一律由關聯
        clients.identity_status 讀取。
    output:
      order_record: 以 case_no 識別的訂單資料；不得含 other_addition。
      created_order: 保留 floor_fee 與既有 client_payments 初始化的新增訂單結果。
    exceptions: []
    invariants:
    - 'INV-SVC-03: DbService 必須自動辨識與解析 notes / care_details 欄位中的 JSON 結構，解開完整 15 項產婦照顧與環境細節欄位，打平注入訂單字典中。'
    - 'INV-SVC-06: 服務層所有訂單、媒合與排班公開介面只能使用唯一 case_no；過渡期 legacy ID 僅能在資料庫雙寫內部使用。'
    - 'INV-SVC-07: BeClass 服務細項只能透過 beclass_records.query_no = case_no 一對一載入，不得以客戶姓名推測關聯。'
    - get_order_by_case_no() 的 SELECT、create_order() 的函式簽名與 INSERT 欄位／值均不得出現 other_addition。
    - floor_fee 必須維持獨立欄位；不得合併至 service_salary 或以 other_addition 替代。
    - create_order() 必須維持 case_no 正規化與 client_payments 初始化行為。
    - 所有訂單讀取、建立與更新不得讀寫 clients.identity_status；身分資格只能 join clients.identity_status
      取得，且不得由訂單 CRUD 修改 clients.identity_status。
    - update_order_full_details 只可更新 clients.name；不得直接更新服務日期、天數、時數、樓層費或訂金日期等 assignment-synchronization
      擁有的 staffing-sensitive 欄位。
    - get_table_data()、get_table_columns() 與 update_table_row() 的允許清單、主鍵映射及任何可寫入分支均不得包含
      legacy payments；三個入口都必須在建立資料庫連線前 fail-closed。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - -q
        - tests\test_db_service_order_other_addition_removal.py
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - py_compile
        - services\db_service.py
        cwd: project
        timeout: 60
        expect_exit: 0
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: low
    algorithm: []
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
    - 不修改 db/schema.sql 或執行資料庫 migration。
    - 不修改 API router、DataBrowserUI、PaymentSchema 或其他 DbService 函式。
    sub_map: services_layer
    state: validated
    fan_in_snapshot: 27
