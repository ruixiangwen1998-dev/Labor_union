    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - list 驗證 filters 與分頁範圍後穩定排序讀取；detail 讀取單一 alert 及依 occurred_at/id 排序的完整事件歷程。
    - claim 以 row lock 驗證 open/claimed/resolved 狀態；更新 claimant projection 後，以 deterministic
      event_key 委派附加 claimed event。
    - resolve 以 row lock 驗證 operator 與狀態，保留既有 claimant；更新 resolution projection 後，以
      deterministic event_key 委派附加 resolved event。
    idempotency:
