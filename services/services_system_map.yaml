    - 不建立配對方案、鎖定、正式 assignment、排班、事件或薪資資料。
    - 不處理履歷發送、意願、單日休假、順延或代班。
    sub_map: services_layer
    state: dirty
    fan_in_snapshot: 3
  CaregiverMatchingPlanVersionService:
    type: service
    description: '[目前代碼規格：Service／schema 1–4 段，產品 fallback 2–4 段] 在聯繫或發送資訊前，使用最新唯讀候選搜尋驗證管理員明確提交的一至四個連續服務區段，再以單一交易建立不可變的
      active proposed 配對方案新版本並 supersede 舊版本；產品多人 fallback UI 與公開 availability 只建立／接受
      2／3／4 段，單月嫂仍走既有四步配對。'
    source: services/caregiver_matching_plan_service.py::create_matching_plan_version
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - DbService
    - CaregiverMatchingPlanSchema
    - CaregiverAvailabilityLockSchema
    - CaregiverSegmentAvailabilityService
    input:
      case_no: 狀態仍為洽談中的唯一案件編號。
      segments: 依 segment_order 排列的一至四段明確 staff_id、assigned_start_date、assigned_end_date。
      created_by: trim 後非空的管理員識別。
      as_of: 呼叫端提供的精確 YYYY-MM-DD 驗證日期；不得由服務讀取現在時間補值。
    output:
      plan_id: 新建或冪等命中的 active plan id。
      case_no: 原案件編號。
      version: 案件內單調遞增版本。
      status: proposed。
      result: created 或 existing。
      segments: 依 segment_order 穩定回傳的不可變方案區段。
    exceptions: []
    invariants:
    - 本服務只接受一至四段完整方案；每位 staff_id 在同一版本最多一段，每段必須連續，依輸入順序無重疊無空缺並恰好覆蓋案件預計起訖日。
    - 最新檔期驗證必須透過已核准 CaregiverSegmentAvailabilityService 且每次 public call 恰好一次；不得另寫第二套候選
      SQL、呼叫 legacy recommendation、讀取 orders.staff_id 或只信任 UI 暫存結果。
    - partial availability、complete combination 不精確相等、assignment／schedule／active_lock／requires_review
      衝突或任何候選缺失都必須 fail-closed，且不得寫入或 supersede 任何方案。
    - 方案版本內容不可 UPDATE／DELETE；調整只能建立新版本。只允許把既有未鎖定 active draft／proposed header 的 status
      改為 superseded 並將 is_active 設 NULL。
    - accepted、rejected、cancelled、superseded 方案不得被當成可修改來源；存在 active availability lock
      時不得建立新版本，必須先走後續正式回復未綁定／釋放流程。
    - 相同 case_no 與完全相同 ordered segments 的 active proposed plan 重試必須 explicit rollback
      後回 existing，不增加 version、不新增 header／segment、不 commit、不產生事件。
    - version 必須在鎖定案件與現有版本後以資料庫 SELECT MAX(version) 查詢決定下一版；不得由呼叫端提供、由 Python 已載入列表
      max／筆數猜測或在 transaction 外計算。
    - 現有方案 segments、active availability lock headers 與其 lock days 必須各自以回傳實體 row id
      的 SELECT ... FOR UPDATE 鎖列；不得只鎖 lock header 而漏掉 caregiver_availability_lock_days，不得用未加
      FOR UPDATE 的查詢，也不得以 COUNT／SUM／MAX 等 aggregate SELECT ... FOR UPDATE 冒充實體 lock-row
      鎖定。
    - transaction 只能寫 caregiver_matching_plans 與 caregiver_matching_plan_segments；不得寫
      matching_records、caregiver_matching_plan_events、availability locks、orders、case_staff_assignments、staff_schedule、payment、actual_hours
      或 settlement。
    - created_by 與日期不得由 server clock、月嫂姓名、訂單欄位或預設值推測；輸出不得包含其他案件、客戶姓名、備註或敏感資料。
    - 驗收測試必須直接覆蓋：2／3／4 段 created；精確相同重試 existing；修改任一 staff/date 建立下一版本且舊 proposed
      superseded；partial／不精確 complete／衝突零寫入；非洽談中、找不到案件、active lock、accepted plan 各自拒絕。
    - 驗收測試必須使用真實 CaregiverSegmentAvailabilityService 的零起算 complete_combinations payload，並各自直接覆蓋
      feasibility=partial 但帶精確 combination、非空 conflicts 但帶精確 combination，兩者皆須零 DB
      connection／零寫入。
    - 驗收測試必須各自直接覆蓋未知欄位、bool／零／負數／非整數 staff_id、重複 staff、非精確日期、逆序、重疊、空缺、越界、未完整覆蓋、空白
      created_by 與 as_of 必填；不得以其他驗證案例或 availability stub 間接替代，並斷言候選 Service 每個 public
      call 恰好一次、單一 connection/cursor、資料庫 SELECT MAX(version) 在鎖內計算、SQL 參數化。
    - 驗收測試必須分別斷言 plan header、segment rows、active lock header rows、active lock day
      rows 都由回傳實體 id 的 FOR UPDATE 查詢鎖定，並精確斷言 orders → plan headers → plan segments
      → active lock headers → active lock days 的 SQL 執行順序，且不得對 aggregate 查詢使用 FOR
      UPDATE；必須逐一注入每個 SELECT、supersede UPDATE、header INSERT、每一筆 segment INSERT、commit、cursor.close、connection.close
      例外，斷言 rollback 與可完成的資源清理，正常路徑另斷言 cursor.close 與 connection.close 各恰好一次。
    - 驗收測試必須使用不提供 closed 屬性、但提供 PyMySQL open／close 語意的 connection double，直接覆蓋成功、existing、SQL
      例外、connection.cursor 建立例外、cursor.close 例外與 connection.close 例外；cursor 建立例外必須保留原始錯誤、rollback
      並關閉 connection，不得出現 UnboundLocalError；不得以自訂 closed 屬性讓測試與 production driver
      脫節。
    - 驗收測試必須逐案斷言成功 commit 一次；existing 不 commit 且 explicit rollback 恰好一次；所有 transaction
      validation／SQL／insert／commit 例外 rollback，且不得留下已 supersede 舊方案但新方案不完整的部分狀態。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_caregiver_matching_plan_service.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-caregiver-matching-plan-service
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 嚴格正規化 case_no、created_by、as_of 與一至四個 segments；拒絕 bool／非正整數 staff_id、未知欄位、非精確日期、重複
      staff、逆序、重疊、空缺、越界或未完整覆蓋案件的草稿，不自動排序、補日或交換日期。
    - 以 segments 建立完整 ordered segment_drafts，呼叫 CaregiverSegmentAvailabilityService
      一次取得最新結果；明確要求 feasibility=complete、conflicts 為空，且提交方案逐段精確等於某一 complete_combinations
      才可進入 persistence。complete_combinations 的 segment_index 沿用該依賴契約之零起算索引，不得在本服務擅自轉為一起算；partial、任何差異或衝突皆拒絕且不得開啟寫入
      transaction。
    - 取得單一 DB connection／cursor，必須依固定順序以回傳實體列的 SELECT ... FOR UPDATE 鎖定：orders.case_no
      → 目前 plan headers → plan segments → active availability lock headers → active
      availability lock days；不可調換順序、漏鎖 lock days 或使用 aggregate locking query。重新確認訂單仍為洽談中。若存在
      active lock、accepted plan 或已進入等待訂金狀態則拒絕調整，不得 supersede。
    - 若目前 active proposed plan 的 ordered segments 與 normalized input 完全一致，必須先 explicit
      rollback 結束唯讀鎖交易，再回傳 existing 並關閉資源；不建立新版本、不更新舊方案。
    - 否則在上述鎖仍持有時以資料庫 SELECT MAX(version) 取得目前最大版本並加一，建立 proposed、is_active=1 新 header
      與全部 segments；建立前先將既有可調整 active draft／proposed header 更新為 superseded、is_active=NULL。全部
      insert／update 成功才 commit，任一錯誤 rollback。
    - cursor／connection 的關閉狀態必須在呼叫 get_connection／connection.cursor 前初始化；get_connection
      成功但 cursor 建立失敗時仍須 rollback 並關閉 connection，且不得因未初始化的 close-state 區域變數改拋 UnboundLocalError。commit
      後回傳新方案與 segments；cursor.close 即使拋錯也不得阻止 connection.close，兩者必須在成功、existing、validation
      failure 及例外路徑各自安全關閉。關閉邏輯必須直接相容 DbService 實際回傳的 PyMySQL Connection API，不得讀取不存在的
      connection.closed；若需判斷只能使用受支援的 open 屬性，或以冪等 close helper 保證最多關閉一次。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
    - 不傳送訂單資訊、履歷或 LINE 訊息，不建立 willingness／resume／cancel 事件。
    - 不執行客戶確認、日期鎖定、回復未綁定、取消釋放或訂金轉正式 assignment。
    - 不建立正式 assignment、日排班、actual_hours、薪資或月結。
    sub_map: services_layer
    state: dirty
    fan_in_snapshot: 1
