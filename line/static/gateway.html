<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新竹市月子工會 - 服務確認入口</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --secondary: #63e6be;
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-dark: #334e68;
            --text-muted: #627d98;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* 選擇按鈕區域 */
        .option-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .option-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.15);
            border-color: var(--primary);
        }

        .option-icon {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .option-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .option-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* 載入遮罩 */
        .loader-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(74, 144, 226, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 15px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo" id="pageLogo">新竹市月子工會</div>
        <div class="title" id="pageTitle">歡迎！請選擇您的狀態</div>
        <div class="subtitle" id="pageSubtitle">為協助您快速完成服務建檔，請告訴我們您是否已經填寫過申請表單？</div>
    </div>

    <div id="actionsContainer"></div>

    <!-- 載入中遮罩 -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">正在準備您的專屬通道...</div>
    </div>
</div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    let currentUserId = '';
    let runtimePage = null;

    // 嘗試從 URL 獲取 fallback userId
    const urlParams = new URLSearchParams(window.location.search);
    const urlUserId = urlParams.get('userId');
    if (urlUserId) {
        currentUserId = urlUserId;
    }

    function getGatewayRequest() {
        const direct = new URLSearchParams(window.location.search);
        let target = direct.get('target') || '';
        let token = direct.get('token') || '';
        const state = direct.get('liff.state');
        if (state) {
            const stateUrl = new URL(state, window.location.origin);
            target = stateUrl.searchParams.get('target') || target;
            token = stateUrl.searchParams.get('token') || token;
        }
        return { target, token };
    }

    function redirectRequestedPage() {
        const request = getGatewayRequest();
        if (request.target !== 'staff-verification') return false;
        if (!request.token) throw new Error('月嫂驗證連結缺少申請憑證');
        const params = new URLSearchParams({
            token: request.token,
            viaLiff: '1'
        });
        window.location.replace(`/staff-verification-page?${params.toString()}`);
        return true;
    }

    async function initLiff() {
        try {
            const [lineResponse, runtimeResponse] = await Promise.all([
                fetch('/api/line/config'),
                fetch('/api/config/liff/runtime?page=gateway')
            ]);
            if (!lineResponse.ok || !runtimeResponse.ok) throw new Error('無法獲取 LIFF 設定');
            const config = await lineResponse.json();
            const runtime = await runtimeResponse.json();
            runtimePage = runtime.page;
            applyRuntime(runtime);

            if (!config.liff_id) {
                if (currentUserId) return;
                throw new Error('LIFF ID 尚未設定');
            }
            await liff.init({ liffId: config.liff_id });
            
            if (!liff.isLoggedIn()) {
                liff.login({ redirectUri: window.location.href });
                return;
            }

            const profile = await liff.getProfile();
            currentUserId = profile.userId;

            if (redirectRequestedPage()) return;
            
            document.getElementById('loaderOverlay').style.display = 'none';
        } catch (err) {
            console.error('LIFF Initialization failed', err);
            // 如果 LIFF 失敗但 URL 有 userId，我們也放行
            if (currentUserId) {
                document.getElementById('loaderOverlay').style.display = 'none';
            } else {
                document.getElementById('loaderText').textContent = runtimePage?.content?.load_error || '載入失敗，請嘗試重新整理。';
                setTimeout(() => { document.getElementById('loaderOverlay').style.display = 'none'; }, 1500);
            }
        }
    }

    function applyRuntime(runtime) {
        const theme = runtime.theme;
        const page = runtime.page;
        const root = document.documentElement.style;
        root.setProperty('--primary', theme.primary_color);
        root.setProperty('--primary-hover', theme.primary_hover_color);
        root.setProperty('--bg-gradient', theme.background);
        root.setProperty('--text-dark', theme.text_color);
        root.setProperty('--text-muted', theme.muted_text_color);
        document.body.style.fontFamily = theme.font_family;
        document.getElementById('pageLogo').textContent = page.content.logo || '';
        document.getElementById('pageTitle').textContent = page.title;
        document.getElementById('pageSubtitle').textContent = page.subtitle;
        document.getElementById('loaderText').textContent = page.loading_text;
        const container = document.getElementById('actionsContainer');
        container.replaceChildren();
        page.actions.forEach(action => {
            const card = document.createElement('a');
            card.href = '#';
            card.className = 'option-card';
            card.addEventListener('click', event => {
                event.preventDefault();
                navigateTo(action.path);
            });
            const icon = document.createElement('div');
            icon.className = 'option-icon';
            icon.textContent = action.icon;
            const title = document.createElement('div');
            title.className = 'option-title';
            title.textContent = action.label;
            const description = document.createElement('div');
            description.className = 'option-desc';
            description.textContent = action.description;
            card.append(icon, title, description);
            container.appendChild(card);
        });
    }

    function navigateTo(path) {
        document.getElementById('loaderOverlay').style.display = 'flex';
        document.getElementById('loaderText').textContent = runtimePage?.content?.redirect_loading_text || '正在為您跳轉...';
        
        let url = path;
        if (currentUserId) {
            url += `?userId=${encodeURIComponent(currentUserId)}`;
        }
        window.location.href = url;
    }

    window.onload = initLiff;
</script>
</body>
</html>
