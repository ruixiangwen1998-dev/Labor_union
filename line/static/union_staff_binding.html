<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>工會人員 LINE 帳號綁定</title>
    <style>
        :root { color-scheme:light; --primary:#4a90e2; --background:#eef3f8; --text:#263238; --muted:#607d8b; --danger:#c62828; --ok:#2e7d32; }
        * { box-sizing:border-box; }
        body { margin:0; padding:20px 12px; background:var(--background); color:var(--text); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; }
        main { max-width:520px; margin:auto; padding:26px 22px; border-radius:18px; background:#fff; box-shadow:0 8px 30px rgba(30,60,90,.10); }
        h1 { margin:0 0 8px; color:var(--primary); font-size:24px; }
        .intro,.privacy { color:var(--muted); line-height:1.65; }
        .privacy { margin-top:18px; font-size:13px; }
        label { display:block; margin:16px 0 7px; font-weight:700; }
        input { width:100%; min-height:46px; padding:10px 12px; border:1px solid #cfd8dc; border-radius:9px; font-size:16px; }
        input:focus { outline:3px solid rgba(74,144,226,.18); border-color:var(--primary); }
        button { width:100%; margin-top:24px; min-height:50px; border:0; border-radius:10px; color:#fff; background:var(--primary); font-size:17px; font-weight:700; cursor:pointer; }
        button:disabled { opacity:.55; cursor:wait; }
        #message { display:none; margin:18px 0 0; padding:13px; border-radius:9px; line-height:1.55; }
        #message.error { display:block; color:var(--danger); background:#ffebee; }
        #message.success { display:block; color:var(--ok); background:#e8f5e9; }
    </style>
</head>
<body>
<main>
    <h1 id="pageTitle">工會人員 LINE 帳號綁定</h1>
    <p class="intro" id="pageSubtitle">請登入您的管理後台帳號。驗證成功後，只會綁定 LINE 身分，不會變更原有權限。</p>
    <form id="bindingForm">
        <label id="usernameLabel" for="username">後台帳號</label>
        <input id="username" name="username" autocomplete="username" maxlength="100" required>
        <label id="passwordLabel" for="password">後台密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required>
        <button id="submitButton" type="submit" disabled>驗證並完成綁定</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <p class="privacy" id="privacyNotice">帳號密碼只用於本次即時驗證，不會寫入綁定申請或操作紀錄。</p>
</main>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    let requestToken = '';
    let developmentUserId = '';
    let enteredThroughLiff = false;
    let idToken = '';
    let runtimePage = null;
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submitButton');

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    function readLiffParameters() {
        const direct = new URLSearchParams(window.location.search);
        requestToken = direct.get('token') || requestToken;
        developmentUserId = direct.get('userId') || developmentUserId;
        enteredThroughLiff = direct.get('viaLiff') === '1' || enteredThroughLiff;
        const state = direct.get('liff.state');
        if (state) {
            const stateUrl = new URL(state, window.location.origin);
            requestToken = stateUrl.searchParams.get('token') || requestToken;
            developmentUserId = stateUrl.searchParams.get('userId') || developmentUserId;
        }
    }

    function applyRuntime(runtime) {
        runtimePage = runtime.page;
        const theme = runtime.theme;
        const fields = Object.fromEntries(runtimePage.fields.map(field => [field.id, field]));
        document.documentElement.style.setProperty('--primary', theme.primary_color);
        document.documentElement.style.setProperty('--background', theme.background);
        document.documentElement.style.setProperty('--text', theme.text_color);
        document.documentElement.style.setProperty('--muted', theme.muted_text_color);
        document.body.style.fontFamily = theme.font_family;
        document.getElementById('pageTitle').textContent = runtimePage.title;
        document.getElementById('pageSubtitle').textContent = runtimePage.subtitle;
        document.getElementById('usernameLabel').textContent = fields.username.label;
        document.getElementById('username').placeholder = fields.username.placeholder;
        document.getElementById('passwordLabel').textContent = fields.password.label;
        document.getElementById('password').placeholder = fields.password.placeholder;
        submitButton.textContent = runtimePage.submit_button;
        document.getElementById('privacyNotice').textContent = runtimePage.content.privacy_notice || '';
    }

    async function prepare() {
        try {
            const [configResponse, runtimeResponse] = await Promise.all([
                fetch('/api/line/config'),
                fetch('/api/config/liff/runtime?page=union_staff_binding')
            ]);
            if (!configResponse.ok || !runtimeResponse.ok) throw new Error('無法取得綁定頁設定');
            const config = await configResponse.json();
            applyRuntime(await runtimeResponse.json());
            const liffId = config.admin_binding_liff_id || config.liff_id;
            if (liffId) {
                await liff.init({ liffId });
                if (!liff.isLoggedIn()) {
                    if (enteredThroughLiff) throw new Error('LINE 登入狀態已失效，請回到聊天室重新開啟綁定連結');
                    if (config.admin_binding_liff_id) {
                        liff.login({ redirectUri: window.location.href });
                        return;
                    }
                    throw new Error('請回到 LINE 聊天室，從最新的綁定連結開啟此頁');
                }
                idToken = liff.getIDToken() || '';
            } else if (config.identity_verification_required) {
                throw new Error('工會人員綁定 LIFF 尚未設定，請聯絡系統管理員');
            }
            readLiffParameters();
            if (!requestToken) throw new Error('綁定連結缺少申請憑證，請回到 LINE 重新申請');
            const stateResponse = await fetch(`/api/line/admin-binding?token=${encodeURIComponent(requestToken)}`);
            const stateBody = await stateResponse.json();
            if (!stateResponse.ok) throw new Error(stateBody.detail || runtimePage.content.expired_message || '綁定連結無效');
            if (stateBody.data.status === 'completed') {
                showMessage(runtimePage.success_description, 'success');
                return;
            }
            submitButton.disabled = false;
        } catch (error) {
            showMessage(error.message || '頁面初始化失敗，請重新開啟。', 'error');
        }
    }

    document.getElementById('bindingForm').addEventListener('submit', async event => {
        event.preventDefault();
        submitButton.disabled = true;
        try {
            const response = await fetch('/api/line/admin-binding/complete', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    token: requestToken,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    line_id_token: idToken,
                    development_line_user_id: developmentUserId
                })
            });
            const body = await response.json();
            if (!response.ok) throw new Error(body.detail || '帳號驗證或綁定失敗');
            document.getElementById('password').value = '';
            showMessage(body.message || runtimePage.success_description, 'success');
        } catch (error) {
            document.getElementById('password').value = '';
            showMessage(error.message || '綁定失敗，請稍後再試。', 'error');
            submitButton.disabled = false;
        }
    });

    window.addEventListener('load', prepare);
</script>
</body>
</html>
