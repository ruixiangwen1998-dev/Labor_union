  AdminAuthorizationDependency:
    type: api_dependency
    description: FastAPI 正式管理員授權依賴，統一驗證 internal service key、Bearer session 與最低角色。
    source: api/dependencies/admin_auth.py
    domain: API
    subsystem: null
    map_file: api\api_system_map.md
    dependencies:
    - AdminAuthService
    input:
      internal_api_key: X-Internal-API-Key header。
      authorization: Authorization Bearer session token。
      minimum_role: endpoint 所需最低角色。
    output:
      admin_principal: 經認證與角色授權的 AdminPrincipal。
    exceptions: []
    invariants:
    - INTERNAL_API_KEY 未設定回 503；缺少或錯誤 internal key 回 401。
    - 正式模式缺少、失效或過期 Bearer session 必須回 401；角色不足必須回 403。
    - 只有 development、dev、local、test 且 ENABLE_ADMIN_AUTH 明確為 false 時才允許 session bypass；internal
      service key 永遠不可 bypass。
    - 成功後必須把 principal 寫入 request.state，供統一 audit middleware 使用。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_admin_auth_security.py
        - -q
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 先要求 X-Internal-API-Key，設定缺失回 503，請求缺失或不符回 401。
    - 僅在明確 development bypass 條件成立時建立 development system_admin principal；其餘情況解析 Bearer
      token。
    - 將 token 委派 AdminAuthService 查詢有效 session，無有效 principal 回 401。
    - 依 endpoint 最低角色比對 principal.role，權限不足回 403；成功後把 principal 寫入 request.state 並回傳。
    idempotency:
      level: unknown
      side_effects: []
