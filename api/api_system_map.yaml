version: 3.0
scope: api_layer
modules:
  OrderRouter:
    type: api_router
    description: 訂單、時程精算與明確多月嫂指派同步 API 路由；同步 Preview／Apply 均要求 system-admin，Apply
      的 applied_by 必須等於 authenticated principal。`/full-details` 只接受不影響 assignment／schedule
      的基本資料。
    source: api/routes/orders.py
    domain: API
    subsystem: null
    map_file: api\api_system_map.md
    dependencies:
    - DbService
    - OrderSchemas
    - OrderAssignmentSynchronizationPreviewService
    - OrderAssignmentSynchronizationApplyService
    - AdminAuthorizationDependency
    input:
      case_no: path 中的 canonical order identifier。
      preview_request: 包含排班關鍵欄位與可編輯訂單主資料完整目標值的 order_change，以及完整明確 assignment_plan。
      apply_request: preview_request 加上完整 schedule_change_plan.remove_schedule_ids
        與非空 applied_by。
    output:
      synchronization_preview: target hours、指派時數影響、required_schedule_removals、sync_status
        與 blocking_reasons。
      synchronization_apply_result: 已套用結果、排班生成摘要、時數確認與 audit_id。
    exceptions: []
    invariants:
    - 兩個同步端點不得直接呼叫 db_service 寫入 orders、case_staff_assignments、staff_schedule、付款、月結或稽核表；所有同步商業操作只能委派對應服務。
    - Preview 必須是唯讀；Apply request 必須同時提供完整 assignment_plan、schedule_change_plan.remove_schedule_ids
      與非空 applied_by，缺少時不得呼叫 Apply 服務。
    - 同步端點不得自行寫入訂單或客戶主資料；更新必須由 Apply service 的單一 transaction 完成。EditOrderUI 不得以 `/full-details`
      先寫入同一份同步變更。
    - API 不得接受 clients.identity_status 或 identity_status；身分資格只能由服務層依 case_no 關聯 clients.identity_status
      讀取。
    - Router 不得建立第二個 FastAPI app 或重複註冊；必須沿用既有 `/api/v1/orders` router 與 BaseResponse
      包裝。
    - Preview／Apply routes 都必須使用 `Depends(require_system_admin)`；Apply 只以 authenticated
      principal 的 canonical username 委派 Service，client applied_by 不一致回 403。
    - '`/full-details` 不得接受或寫入 service_days、service_hours_per_day、floor_fee、start/end/actual
      dates 或 deposit_date；這些 staffing-sensitive 欄位只由 assignment-synchronization Preview／Apply
      transaction 更新。'
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_order_assignment_synchronization_router.py
        - tests\test_order_assignment_synchronization_app_routes.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-order-assignment-router
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - '`POST /{case_no}/assignment-synchronization/preview` 驗證完整非取消 order_change（不含
      identity_status 或 clients.identity_status）與 HTTP payload 後，僅委派 OrderAssignmentSynchronizationPreviewService，並以
      BaseResponse 回傳其完整結果。'
    - '`POST /{case_no}/assignment-synchronization/apply` 驗證完整移除計畫及 applied_by 後，僅委派
      OrderAssignmentSynchronizationApplyService；未套用的 locked、requires_review 或 requires_allocation
      結果須回傳明確 HTTP 409 與原因。'
    - 服務層的 ValueError 必須轉成明確 HTTP 422；不得由 router 吞掉後回傳成功。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals: []
    sub_map: api_layer
    state: dirty
    fan_in_snapshot: 5
    known_symbols:
    - apply_order_assignment_synchronization
    - cancel_order_lock_for_case_no
    - get_all_orders
    - get_order_by_case_no
    - preview_order_assignment_synchronization
    - update_order_full_details
    - update_order_status
  MatchRouter:
    type: api_router
    description: 案件推薦、原配對紀錄、方案版本、active/contact state、逐段資訊／意願、共用履歷與取消方案 API。新方案動作委派
      matching plan／communication Services；既有四步單月嫂端點委派 LegacyCaregiverMatchingService，不在
      Router 直接查 DB。
    source: api/routes/matches.py
    domain: API
    subsystem: null
    map_file: api\api_system_map.md
    dependencies:
    - MatchSchemas
    - CaregiverMatchingPlanVersionService
    - CaregiverMatchingCommunicationService
    - LegacyCaregiverMatchingService
    - AdminAuthorizationDependency
    input:
      matching_plan: path case_no，以及明確 1–4 segments、created_by、as_of。
      matching_event: path case_no／plan_id／segment_id 與 event_key、actor、資訊種類／意願／共用履歷備註／取消原因。
    output:
      matching_plan_version: Service 回傳的 created 或 existing plan、version 與 segment
        ownership。
      matching_contact_state: active plan、逐段發送／意願／履歷狀態與 waiting-deposit lifecycle
        snapshot。
    exceptions: []
    invariants:
    - 正式 matching plan 不得保存到 matching_records，亦不得呼叫 legacy assign_staff_to_order 建立正式
      assignment。
    - Router 不得直接讀寫 matching plan、segment、availability lock 資料表，或重做版本遞增、完整覆蓋、active
      plan、active lock、交易與冪等邏輯。
    - Service 的 created／existing、plan version 與 segment ownership 必須原樣回傳；不可將 existing
      重包裝成新版本。
    - 不得修改既有推薦、聯繫、履歷、LINE 發送與定案端點的 request／response 行為。
    - '`POST /orders/{case_no}/matching-plans` 與 legacy 單月嫂 endpoints 都使用 require_system_admin；actor／created_by
      不得冒用 authenticated principal。'
    - matching plan 的 case not found 回 404、狀態或 lock 衝突回 409、request/domain validation
      回 422、unexpected failure 才回不洩漏內部細節的固定 500。
    - Router 不得取得 connection、執行 SQL 或直接 import DbService；legacy DB／LINE 相容行為只由 LegacyCaregiverMatchingService
      擁有。
    - 非預期錯誤不得向 API response 洩漏 SQL、連線或內部例外文字。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_caregiver_matching_plan_router.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-caregiver-matching-plan-router
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - POST /api/v1/orders/{case_no}/matching-plans 驗證 HTTP request shape 與 system-admin
      principal；created_by 必須等於 principal，再將 canonical actor 與 case_no、segments、as_of
      精確傳給 CaregiverMatchingPlanVersionService。
    - 將 Service 回傳的 created 或 existing 結果包裝為既有 BaseResponse；不得自行重算 plan、version、availability
      或 lock。
    - active/contact state、information、willingness、resumes 與 cancel routes 分別委派 CaregiverMatchingCommunicationService
      對應函式；mutation routes 以 `_require_matching_actor` 比對 authenticated principal
      與 body.actor。
    - legacy recommend-staff、matching_records、send-info-1/2、reply、send-resume 與 assign
      endpoints 維持既有 request／response 行為，但一律委派 LegacyCaregiverMatchingService，供原四步單月嫂配對使用。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
    - 不新增 router 檔、不修改 api/main.py、不建立 availability lock、正式 assignment、排班、休假、代班或薪資。
    sub_map: api_layer
    state: dirty
    fan_in_snapshot: 2
    known_symbols:
    - _require_matching_actor
    - assign_staff_to_order
    - cancel_matching_plan_route
    - create_matching_plan_version_route
    - get_active_matching_plan_state_route
    - get_matching_plan_contact_state_route
    - recommend_staff
    - record_matching_plan_willingness_route
    - reply_matching_inquiry
    - send_info_1
    - send_info_2
    - send_matching_plan_information_route
    - send_matching_plan_resumes_route
    - send_resume_for_case
    - send_resume_to_client
  CaregiverAvailabilityLockRouter:
    type: api_router
    description: 以三個明確管理端 mutation endpoint 薄層接線 availability lock 的確認鎖定、回復未綁定與訂金轉正式
      assignment；訂單取消沿用既有 OrderRouter。
    source: api/routes/caregiver_availability_locks.py
    domain: API
    subsystem: null
    map_file: api\api_system_map.md
    dependencies:
    - CaregiverAvailabilityLockAcquisitionService
    - CaregiverAvailabilityLockReleaseService
    - CaregiverAvailabilityLockConversionService
    input:
      acquisition: case_no、plan_id、event_key、actor。
      release: case_no、plan_id、lock_id、event_key、actor、reason。
      conversion: case_no、lock_id、event_key、actor、reason、assignment_terms。
    output:
      lifecycle_result: Service-owned created 或 existing 結果，包含穩定的 lock、plan、segment
        與 assignment snapshots。
    exceptions: []
    invariants:
    - Router 不得取得 DB connection、執行 SQL、commit、rollback 或建立 transaction。
    - 不得複製 mutex、占用重查、append-only event、冪等或 lifecycle transition。
    - API payload 不接受 status、plan ownership、staff ownership、lock state、historical
      bypass、任意 table 或任意 service 名稱。
    - case_no、plan_id 與 lock_id 必須由明確 path 指定，不得由姓名、legacy orders.staff_id 或 response
      推測。
    - Service 回傳的穩定 snapshot 不得由 Router 重新計算、重排或刪減。
    - 訂單取消與 lock cancellation 必須繼續沿用既有 OrderRouter endpoint，不得在本 Router 新增第二條取消路徑。
    - 非預期錯誤不得洩漏 SQL、連線或內部例外文字。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_caregiver_availability_lock_router.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-caregiver-availability-lock-router
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - acquisition endpoint 驗證基本 request shape 後，精確委派 CaregiverAvailabilityLockAcquisitionService。
    - release endpoint 驗證明確 lock ownership identifiers 與 reason 後，精確委派 CaregiverAvailabilityLockReleaseService。
    - conversion endpoint 要求每個 segment 的 assignment_terms，精確委派 CaregiverAvailabilityLockConversionService，不自行補推費率、樓層費、staff
      或日期。
    - 三個 endpoint 各自包裝既有 Service 結果；不得以自由文字 action 參數共用單一動態 handler。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
    - 不修改 acquisition、release、cancellation 或 conversion service。
    - 不新增通用 lock transaction service、動態 action endpoint、排班、休假、代班、付款或 UI 邏輯。
    - 不修改 api/main.py；router registration 由後續既有 entrypoint 節點升級處理。
    sub_map: api_layer
    state: dirty
    fan_in_snapshot: 2
    known_symbols:
    - AssignmentTerm._reject_float_money
    - _require_actor
    - _service_error
    - _service_response
    - acquire_availability_lock
    - convert_availability_lock
    - release_availability_lock
  CaregiverSegmentAvailabilityRouter:
    type: api_router
    description: 提供正式管理員依洽談中案件搜尋連續月嫂候選的唯讀 API。公開多人 search 只接受 2／3／4 段；單月嫂完整期間 gate
      使用獨立 caregiver-single-eligibility/check endpoint，segment_count=1 僅存在 Router
      對 Service 的內部委派。
    source: api/routes/caregiver_segment_availability.py::_as_iso_date,_value_to_status,_response_from_service,check_single_caregiver_eligibility,search_caregiver_segment_availability
    domain: API
    subsystem: null
    map_file: api\api_system_map.md
    dependencies:
    - CaregiverSegmentAvailabilityService
    - AdminAuthorizationDependency
    input:
      http_method: POST。
      path: /api/v1/orders/{case_no}/caregiver-segment-availability/search，及 /api/v1/orders/{case_no}/caregiver-single-eligibility/check。
      case_no: 路徑案件編號，必須為非空字串。
      body: CaregiverSegmentAvailabilitySearchRequest，精確包含 segment_count、ordered segment_drafts
        與 as_of。
      admin_principal: 由 require_system_admin 產生的可信 AdminPrincipal。
    output:
      response: BaseResponse[CaregiverSegmentAvailabilityResponse]。
      data: 精確包含 case_no、planned_start_date、planned_end_date、feasibility、complete_combinations、segment_candidates、conflicts。
    exceptions: []
    invariants:
    - Router 只能進行 Pydantic 驗證、正式管理員授權、一次 Service 委派、typed response 組裝與錯誤映射；不得 import
      DbService、get_connection、執行 SQL、DML、commit、rollback、讀取 orders.staff_id 或呼叫 legacy
      recommendation。
    - endpoint 必須使用 Depends(require_system_admin) 或等價正式 dependency；X-Internal-API-Key
      永遠必填，Bearer 只在 AdminAuthorizationDependency 明確允許的 development/test bypass 才可省略。401、403、503
      必須由 dependency 原樣 fail-closed，不得在 router 內自行比對 header。
    - request 與所有巢狀 request models 必須拒絕未知欄位；segment_drafts 必須保留輸入順序，不得排序、去重、補日期、交換日期或預選第一位月嫂。
    - segment_count=1 是內部唯讀相容契約，只能由 caregiver-single-eligibility/check 用於判斷單月嫂是否完整覆蓋；API
      client 與產品多人配對 UI 不得向公開多人 search 傳入 1。
    - as_of 必須由 request 明確提供且只接受精確 YYYY-MM-DD；不得讓 Pydantic 先把 `YYYY-MM-DDT00:00:00`、datetime
      或其他含時間值 coercion 成 date 後繞過驗證，也不得在 router 讀取 today、now 或伺服器時鐘補值。
    - response models 必須禁止未宣告欄位並保留 Service 的穩定排序；feasibility 只允許 complete 或 partial，日期以
      YYYY-MM-DD 序列化。
    - 404 只用於案件不存在；409 只用於案件不再是洽談中；Pydantic 錯誤、案件日期不足與 Service validation error 使用
      422；unexpected error 使用固定 500 detail。
    - 驗收測試必須直接覆蓋：Service 參數與 call count 恰好一次；complete 與 partial 各自 HTTP 200 且 typed
      data 完整；case not found 404；非洽談中 409；非法 segment_count、staff_id、日期、草稿順序、未知頂層與巢狀欄位各自
      422；as_of／start_date／end_date 的含時間字串與 datetime 各自拒絕；unexpected exception 500
      且不含原始訊息。
    - 驗收測試必須覆蓋正式 auth 的 internal key 未設定 503、missing／wrong internal key、missing／expired
      Bearer、角色不足與明確 development/test bypass；並由 OpenAPI 或獨立 FastAPI app 證明 path、request
      與 response schema 正確。
    - 以 source AST 或等價檢查證明 Router 不 import DB、不含 SQL／DML／transaction、不讀 orders.staff_id、不呼叫
      legacy recommendation，且本節點不得修改 api/main.py。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_caregiver_segment_availability_router.py
        - -q
        - -p
        - no:cacheprovider
        - --basetemp
        - C:\tmp\pytest-caregiver-segment-availability-router
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 以檔案內 Pydantic models 宣告 request、segment draft、segment result、candidate、conflict
      與 response；所有 request models 使用 extra=forbid，公開多人 request 的 segment_count 只允許
      2、3、4。單人 gate request 只包含 start_date、end_date、as_of，由 Router 固定以 segment_count=1
      委派 Service。
    - 對 POST endpoint 套用 require_system_admin；將 path case_no 與 request 的 segment_count、ordered
      segment_drafts、as_of 精確傳給 search_segmented_caregiver_availability，且每次 request
      恰好呼叫一次。
    - 將 Service 回傳內容建構為 typed response；complete 與 partial 均回 HTTP 200，partial 不得被轉成錯誤、清空
      segment_candidates 或隱藏 conflicts。
    - Service 的 case not found 映射 404、非洽談中映射 409，其餘 ValueError 映射 422；非預期例外只回固定 500
      訊息，不得洩漏 SQL、connection、其他案件或內部例外文字。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals:
    - 不儲存 matching plan、履歷發送、意願、日期鎖、正式 assignment、排班、休假、代班或薪資。
    - 不處理客戶確認、回復未綁定、取消釋放或訂金轉正式 assignment。
    sub_map: api_layer
    state: dirty
    fan_in_snapshot: 3
